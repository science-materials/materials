<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новые материалы: подборки</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f5f7fa; color: #1a1a1a; padding: 1rem; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .card { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .card h2 { margin: 0 0 0.5rem 0; font-size: 1.15rem; }
    .journal { color: #555; font-weight: 500; margin: 0.2rem 0 0.5rem 0; }
    .abstract { color: #333; line-height: 1.5; margin: 0 0 1rem 0; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .date { font-size: 0.85rem; color: #888; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <h1>🧪 Новые материалы: ежедневные статьи</h1>
  <div id="feed"></div>

  <script>
    async function loadFeed() {
      try {
        const res = await fetch("articles.json");
        if (!res.ok) throw new Error("Network error");
        const articles = await res.json();

        const container = document.getElementById("feed");
        if (articles.length === 0) {
          container.innerHTML = "<p>Сегодня новых статей не найдено.</p>";
          return;
        }

        container.innerHTML = articles.map(a => `
          <article class="card">
            <h2>${escapeHtml(a.title)}</h2>
            <div class="journal">🏢 ${escapeHtml(a.journal)}</div>
            <div class="abstract">📝 ${escapeHtml(a.abstract)}</div>
            <a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer">🔗 Ссылка на статью</a>
            ${a.date ? `<div class="date">Дата публикации: ${a.date}</div>` : ""}
          </article>
        `).join("");
      } catch (e) {
        document.getElementById("feed").innerHTML = `<p style="color:red">Ошибка загрузки: ${e.message}</p>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadFeed();
  </script>
</body>
</html>
