name: Daily Science Feed Update

on:
  schedule:
    - cron: "22 12 * * *"  # 08:00 UTC. Для Москвы это 11:00.
  workflow_dispatch:   # можно запустить вручную кнопкой в Actions

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily science feed"
            git push
          fi
 
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles.json
          git commit -m "Update articles.json" || echo "No changes to commit"
          git push
